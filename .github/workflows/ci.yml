name: CI Pipeline - Code Quality, Security & Model Gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-security:
    name: Linting & SAST Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Ruff Linter Check
        run: ruff check .

      - name: Ruff Code Formatting Check
        run: ruff format --check .

      - name: Bandit Security Analysis
        run: bandit -c pyproject.toml -r src/

  tests-and-quality-gate:
    name: Unit Tests & Model Quality Gate
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Execute Pytest Suite
        run: pytest tests/ -v

      - name: Ingestion & Smoke Training
        run: |
          python src/data/ingest.py
          python src/data/split.py
          python src/models/train.py
          python src/models/evaluate.py

      - name: Model Quality Gate Verification
        run: python src/models/register.py
