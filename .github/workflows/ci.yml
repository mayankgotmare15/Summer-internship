name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check code formatting and linting
        run: |
          ruff check .
          ruff format --check .

  data-and-quality-gate:
    name: Data Validation & Model Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pandera Data Schema Validation
        run: |
          python -m src.data.validate

      - name: Verify Champion Bundle & Quality Gate
        run: |
          python -c "from src.ml.store import ModelStore; s = ModelStore(); s.load(); assert s.is_ready; print('Bundle manifest & integrity OK')"

  backend-tests-and-migrations:
    name: Backend Tests & Alembic Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Alembic Migrations Up and Down
        run: |
          mkdir -p local_db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Full Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-coverage-report
          path: coverage.xml
          retention-days: 7

  frontend-check:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  container-smoke-test:
    name: Container Build & API Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-format, backend-tests-and-migrations, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test runner dependencies
        run: |
          pip install httpx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build RouteDesk API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: routedesk-api:ci-test

      - name: Run Containerized API
        run: |
          docker run -d \
            --name routedesk-ci \
            -p 8000:8000 \
            -e DEMO_MODE=true \
            -e JWT_SECRET=test-secret-at-least-32-chars-long-abc123 \
            -e SERVICE_TOKEN=test-service-token-12345 \
            -e DATABASE_URL="sqlite:////app/local_db/ci_test.db" \
            routedesk-api:ci-test

      - name: Execute Live Smoke Verification
        run: |
          python scripts/smoke_test.py --base-url http://localhost:8000 --retries 25 --delay 1.0

      - name: Check Container Logs on Failure
        if: failure()
        run: |
          docker logs routedesk-ci

      - name: Teardown Container
        if: always()
        run: |
          docker stop routedesk-ci || true
          docker rm routedesk-ci || true
