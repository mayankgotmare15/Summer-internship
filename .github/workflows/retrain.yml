name: Continuous Retraining (CT) Pipeline

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for triggering retraining (e.g. drift breach, new labeled batch)"
        required: false
        default: "Manual CT Trigger"

jobs:
  retrain-and-evaluate:
    name: Retrain Challenger & Evaluate Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest & Preprocess Training Data
        run: |
          python src/data/ingest.py
          python src/data/split.py

      - name: Train Challenger Model
        run: |
          python src/models/train.py

      - name: Evaluate Challenger Performance
        run: |
          python src/models/evaluate.py

      - name: Champion-Challenger Quality Gate
        run: |
          python src/models/register.py

      - name: Trigger Redeployment if Champion Updated
        run: |
          echo "Retraining successful. Champion promoted. Dispatching CD workflow."
