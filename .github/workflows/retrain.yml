name: Retraining Pipeline

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Reason for triggering retraining"
        required: false
        default: "Manual trigger or monitoring breach"
      version_tag:
        description: "Version tag for retrained candidate"
        required: false
        default: "v2-retrained"

jobs:
  champion-challenger-retrain:
    name: Train Challenger, Evaluate Quality Gate & Promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Champion-Challenger Retraining Pipeline
        id: retrain
        run: |
          python -m src.models.retrain --version-tag "${{ github.event.inputs.version_tag || 'v2-retrained' }}"

      - name: Verify New Champion Bundle Smoke Checks
        run: |
          python -c "from src.ml.store import ModelStore; s = ModelStore(); s.load(); assert s.is_ready; print('New champion bundle ready:', s.get_manifest().get('version'))"

      - name: Upload Retraining Comparison Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retraining-comparison-report
          path: |
            reports/retraining_comparison.json
            reports/metrics.json
            reports/threshold.json
            models/champion.json
          retention-days: 30

      - name: Trigger Automated Redeploy on Promotion
        if: steps.retrain.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Challenger promoted to Champion! Triggering CD redeployment...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              ref: 'master'
            });
