name: CD Pipeline - Build, Scan & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ticket-router-api

jobs:
  build-and-deploy:
    name: Build Container, Scan & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository }}/ticket-router-api' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Container Smoke Test
        run: |
          docker run -d --name test-api -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
          for i in {1..20}; do
            if curl -sf http://localhost:8000/health; then
              echo "Container health check passed successfully!"
              docker stop test-api
              exit 0
            fi
            echo "Waiting for container to boot (attempt $i/20)..."
            sleep 2
          done
          echo "Container health check failed. Diagnostic logs:"
          docker logs test-api
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Verification
        run: |
          echo "Image successfully published to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Automated webhook triggered for live deployment environment."
