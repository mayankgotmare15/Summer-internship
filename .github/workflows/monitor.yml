name: Model Drift and Performance Monitoring

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      auto_retrain_on_breach:
        description: "Automatically trigger retraining pipeline if threshold breached"
        type: boolean
        default: true

jobs:
  monitor-drift-and-thresholds:
    name: Generate Evidently Drift Report & Check Thresholds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export Monitoring Reference and Production Datasets
        run: |
          python -m src.monitoring.export --output-dir reports/monitoring_data

      - name: Generate Evidently AI Drift and Data Summary Report
        run: |
          python -m src.monitoring.drift_report \
            --reference-path reports/monitoring_data/reference.parquet \
            --current-path reports/monitoring_data/current.parquet \
            --html-output reports/drift_report.html \
            --json-output reports/drift_metrics.json

      - name: Evaluate Monitoring Policy Thresholds
        id: check_thresholds
        continue-on-error: true
        run: |
          python -m src.monitoring.check_thresholds \
            --metrics-path reports/drift_metrics.json \
            --alert-output reports/alert_summary.json

      - name: Upload Evidently Drift Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidently-drift-report
          path: |
            reports/drift_report.html
            reports/drift_metrics.json
            reports/alert_summary.json
          retention-days: 14

      - name: Trigger Automated Retraining Pipeline on Breach
        if: steps.check_thresholds.outcome == 'failure' && (github.event.inputs.auto_retrain_on_breach == 'true' || github.event_name == 'schedule')
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Monitoring threshold breached! Triggering champion-challenger retraining pipeline...");
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'retrain.yml',
              ref: 'master',
              inputs: {
                trigger_reason: 'Automated monitoring threshold breach detected'
              }
            });
