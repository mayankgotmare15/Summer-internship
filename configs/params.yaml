data:
  raw_routing_path: "data/raw/ticket_routing.csv"
  raw_priority_path: "data/raw/ticket_priority.csv"
  processed_dir: "data/processed"
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  held_out_drift_category: "Storage"

preprocess:
  lowercase: true
  remove_stopwords: true
  lemmatize: true
  max_features: 10000
  ngram_range: [1, 2]
  min_df: 2

train:
  model_type: "logistic_regression"
  C: 1.0
  penalty: "l2"
  class_weight: "balanced"
  solver: "lbfgs"
  max_iter: 1000
  random_seed: 42

priority_model:
  model_type: "logistic_regression"
  C: 1.0
  class_weight: "balanced"
  max_iter: 1000
  random_seed: 42

decision:
  default_confidence_threshold: 0.75
  min_auto_route_accuracy: 0.90
  max_text_length: 5000

business_impact:
  tickets_per_month: 5000
  triage_minutes_saved: 3.0
  misroute_penalty_minutes: 15.0
  agent_hourly_rate_usd: 10.0

monitoring:
  low_confidence_threshold: 0.25
  agent_override_threshold: 0.15
  drift_feature_threshold: 0.30
  window_size: 500
