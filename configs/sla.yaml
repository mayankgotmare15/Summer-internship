    workload_weight: 2

  Low:
    first_response_minutes: 480 # 8 business hours
    resolution_minutes: 4320 # 72 business hours (9 business days)
    calendar: "business"
    workload_weight: 1

approval:
  target_minutes: 480 # 1 business day

auto_close:
  after_resolved_minutes: 1440 # 3 business days
