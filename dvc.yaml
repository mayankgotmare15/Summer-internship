stages:
  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
      - data/raw/routing.csv
      - data/raw/priority.csv
    outs:
      - data/interim/routing.parquet
      - data/interim/priority.parquet

  validate:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - data/interim/routing.parquet
      - data/interim/priority.parquet
    outs:
      - reports/validation.json

  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - data/interim/routing.parquet
      - data/interim/priority.parquet
    params:
      - seed
      - split.train
      - split.val
      - split.test
      - split.holdout_category
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - data/holdout/storage_holdout.parquet

  preprocess:
    cmd: python -m src.ml.preprocess --input-dir data/processed --output-dir data/features
    deps:
      - src/ml/preprocess.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
    params:
      - preprocess
    outs:
      - data/features/train.parquet
      - data/features/val.parquet
      - data/features/test.parquet

  train_routing:
    cmd: python src/models/train.py --task routing
    deps:
      - src/models/train.py
      - data/features/train.parquet
    params:
      - routing
      - seed
    outs:
      - artifacts/routing/model.skops

  train_priority:
    cmd: python src/models/train.py --task priority
    deps:
      - src/models/train.py
      - data/features/train.parquet
    params:
      - priority
      - seed
    outs:
      - artifacts/priority/model.skops

  evaluate:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - artifacts/routing/model.skops
      - artifacts/priority/model.skops
      - data/features/test.parquet
    metrics:
      - reports/metrics.json:
          cache: false

  threshold_sweep:
    cmd: python src/models/sweep.py
    deps:
      - src/models/sweep.py
      - artifacts/routing/model.skops
      - data/features/val.parquet
    params:
      - cost_model
    outs:
      - reports/sweep.csv
      - reports/sweep.png
      - reports/threshold.json

  package_bundle:
    cmd: python -m src.ml.bundle --action package
    deps:
      - src/ml/bundle.py
      - artifacts/routing/model.skops
      - artifacts/priority/model.skops
      - reports/threshold.json
    outs:
      - artifacts/bundle/manifest.json
