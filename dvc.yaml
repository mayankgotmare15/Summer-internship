stages:
  ingest:
    cmd: python src/data/ingest.py
    deps:
      - src/data/ingest.py
    outs:
      - data/raw/ticket_routing.csv

  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - src/data/validate.py
      - src/features/preprocess.py
      - data/raw/ticket_routing.csv
    params:
      - data
      - preprocess
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv

  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - data/processed/train.csv
      - data/processed/val.csv
    params:
      - train
    outs:
      - models/routing_model.joblib

  evaluate:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - models/routing_model.joblib
      - data/processed/test.csv
    metrics:
      - reports/eval_metrics.json:
          cache: false

  register:
    cmd: python src/models/register.py
    deps:
      - src/models/register.py
      - reports/eval_metrics.json
    outs:
      - models/champion_metadata.json
